name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate theme
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4 package --out verdant-ledger-light.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: verdant-ledger-light-vsix
          path: verdant-ledger-light.vsix
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      # The oldest Node the site supports (engines in site/package.json), so a
      # dependency that needs a newer one fails here instead of for contributors.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Build site
        run: npm run build
