name: Release

# Push a tag such as v1.0.0 to build the VSIX, attach it to a GitHub release,
# and publish it to Open VSX. The VS Code Marketplace upload is manual; see
# CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate theme
        run: npm test

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=verdant-ledger-light-$version.vsix" >> "$GITHUB_ENV"

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4 package --out "$VSIX"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "Verdant Ledger Light $VERSION" \
            --notes-file release-notes.md

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, so the Open VSX upload was skipped."
            exit 0
          fi
          npx --yes ovsx@1 publish "$VSIX" --pat "$OVSX_PAT"

      - name: Remind about the Marketplace upload
        run: |
          echo "::notice::Upload $VSIX from the GitHub release to https://marketplace.visualstudio.com/manage/publishers/nelvaron"
